<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>东方超市 · 世界杯竞猜核销</title>
<style>
  :root{
    --green:#3a8c50; --green-d:#2a5c34; --leaf:#6ab04c; --amber:#f4a72c; --amber-d:#d98410;
    --cream:#fdf8ee; --ink:#2f2922; --soft:#6b5d52; --line:#e7dcc6; --red:#c44536; --ok:#2e9e57;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 60% at 50% 0%,#fef0d6,#f1e6cc);min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:440px;margin:0 auto;padding:18px 16px 40px}
  .brand{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 4px}
  .brand .logo{font-size:22px}
  .brand h1{font-size:16px;margin:0;font-weight:800;color:var(--green-d)}
  .tagline{text-align:center;font-size:12px;color:var(--soft);margin-bottom:18px}

  .card{background:#fffdf7;border:1px solid var(--line);border-radius:16px;padding:18px;
    box-shadow:0 6px 18px rgba(120,90,40,.10)}
  label{display:block;font-size:12.5px;color:var(--soft);margin:0 0 6px;font-weight:600}
  input{width:100%;border:2px solid var(--line);border-radius:12px;padding:13px 14px;font-size:18px;
    font-family:inherit;color:var(--ink);background:#fff;outline:none;transition:border-color .15s}
  input:focus{border-color:var(--leaf)}
  input.code{text-transform:uppercase;letter-spacing:3px;font-weight:800;text-align:center;font-size:24px}
  .btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800;
    font-family:inherit;cursor:pointer;margin-top:12px;color:#fff;
    background:linear-gradient(160deg,var(--leaf),var(--green));box-shadow:0 4px 12px rgba(58,125,44,.32);
    transition:transform .12s,opacity .15s}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.55;cursor:default;box-shadow:none}
  .btn.amber{background:linear-gradient(160deg,var(--amber),var(--amber-d));box-shadow:0 4px 12px rgba(217,132,16,.32)}
  .btn.ghost{background:#fff;color:var(--soft);border:1.5px solid var(--line);box-shadow:none}
  .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;text-align:center}

  .hidden{display:none!important}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;text-align:center;padding:9px;border-radius:10px;font-size:13.5px;font-weight:700;
    background:#f1e7d2;color:var(--soft);cursor:pointer;border:0}
  .tab.on{background:var(--green);color:#fff}

  /* result */
  .res{margin-top:16px;border-radius:14px;padding:16px;text-align:center;display:none}
  .res.show{display:block;animation:pop .2s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
  .res.valid{background:#eef8ec;border:1.5px solid #bfe0a8}
  .res.used{background:#fff3da;border:1.5px solid #f0d28a}
  .res.bad{background:#fdeceb;border:1.5px solid #f1c4bf}
  .res .pz{font-size:22px;font-weight:800;margin:2px 0 4px}
  .res .who{font-size:13px;color:var(--soft)}
  .res .st{font-size:13px;font-weight:700;margin-top:8px}
  .res.valid .st{color:var(--ok)} .res.used .st{color:var(--amber-d)} .res.bad .st{color:var(--red)}
  .res .code2{font-family:ui-monospace,monospace;letter-spacing:2px;font-weight:800;color:var(--amber-d)}

  .stat{font-size:12px;color:var(--soft);text-align:center;margin:10px 0 0}
  .list{margin-top:6px}
  .row{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #f0e8d6;font-size:13px}
  .row .c{font-family:ui-monospace,monospace;font-weight:800;color:var(--amber-d);width:74px;flex:none}
  .row .p{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .s{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;flex:none}
  .row .s.y{background:#e7f6ea;color:var(--ok)} .row .s.n{background:#fdeee0;color:var(--amber-d)}
  .muted{color:var(--soft);font-size:12.5px;text-align:center;padding:16px}
  .foot{text-align:center;font-size:11px;color:#a99e90;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo">🛒</span><h1>东方超市 · 竞猜核销</h1></div>
  <div class="tagline">世界杯观赛台 · 实物好礼券码核销台</div>

  <!-- 口令门 -->
  <div id="gate" class="card">
    <label for="pass">收银口令</label>
    <input id="pass" type="password" inputmode="numeric" autocomplete="off" placeholder="输入核销口令">
    <button class="btn" id="enterBtn">进入核销台</button>
    <div class="err" id="gateErr"></div>
  </div>

  <!-- 核销台 -->
  <div id="console" class="hidden">
    <div class="tabs">
      <button class="tab on" id="tabRedeem">核销券码</button>
      <button class="tab" id="tabList">核销记录</button>
    </div>

    <!-- 核销 -->
    <div id="paneRedeem">
      <div class="card">
        <label for="code">输入顾客券码</label>
        <input id="code" class="code" autocomplete="off" maxlength="8" placeholder="WC----">
        <button class="btn" id="lookupBtn">查询</button>
        <div class="err" id="redeemErr"></div>
        <div class="res" id="res"></div>
      </div>
    </div>

    <!-- 记录 -->
    <div id="paneList" class="hidden">
      <div class="card">
        <div class="stat" id="listStat">载入中…</div>
        <div class="list" id="listBox"></div>
        <button class="btn ghost" id="refreshBtn">刷新</button>
      </div>
    </div>

    <button class="btn ghost" id="lockBtn" style="margin-top:14px">🔒 锁定退出</button>
  </div>

  <div class="foot">© 东方超市 Eastern Market · 仅限店员使用</div>
</div>

<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script defer src="https://www.gstatic.com/firebasejs/10.14.1/firebase-functions-compat.js"></script>
<script>
window.addEventListener('load', function () {
  var firebaseConfig = {
    apiKey: 'AIzaSyDDhVm_n_TyV2mtp517qUoLU4A9HB1k3No',
    authDomain: 'eastern-market-members.firebaseapp.com',
    projectId: 'eastern-market-members',
    storageBucket: 'eastern-market-members.firebasestorage.app',
    messagingSenderId: '515107029536',
    appId: '1:515107029536:web:9f6caef22bae67aa5af245',
  };
  if (typeof firebase === 'undefined' || !firebase.initializeApp) {
    document.getElementById('gateErr').textContent = '网络/SDK 加载失败,请刷新';
    return;
  }
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var call = firebase.app().functions('us-central1').httpsCallable('wcLotteryRedeem');

  var $ = function (id) { return document.getElementById(id); };
  // 防 XSS:顾客姓名等字段进 innerHTML 前一律转义(会员名可含任意字符)
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var PASS = sessionStorage.getItem('wc_redeem_pass') || '';

  function showConsole() { $('gate').classList.add('hidden'); $('console').classList.remove('hidden'); }
  function lock() { PASS = ''; sessionStorage.removeItem('wc_redeem_pass');
    $('console').classList.add('hidden'); $('gate').classList.remove('hidden'); $('pass').value = ''; }

  async function api(payload) {
    payload.pass = PASS;
    var r = await call(payload);
    return r.data;
  }

  // ---- gate ----
  $('enterBtn').onclick = async function () {
    var p = $('pass').value.trim();
    if (!p) return;
    $('gateErr').textContent = ''; $('enterBtn').disabled = true;
    PASS = p;
    try {
      await api({ action: 'ping' });
      sessionStorage.setItem('wc_redeem_pass', p);
      showConsole(); $('code').focus();
    } catch (e) {
      PASS = '';
      $('gateErr').textContent = (e && e.code === 'permission-denied') ? '口令错误' : ('出错:' + (e.message || e));
    } finally { $('enterBtn').disabled = false; }
  };
  $('pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('enterBtn').click(); });

  // ---- tabs ----
  $('tabRedeem').onclick = function () { $('tabRedeem').classList.add('on'); $('tabList').classList.remove('on');
    $('paneRedeem').classList.remove('hidden'); $('paneList').classList.add('hidden'); };
  $('tabList').onclick = function () { $('tabList').classList.add('on'); $('tabRedeem').classList.remove('on');
    $('paneList').classList.remove('hidden'); $('paneRedeem').classList.add('hidden'); loadList(); };
  $('lockBtn').onclick = lock;

  // ---- redeem ----
  var current = null;
  function renderRes(d) {
    var el = $('res'); el.className = 'res show';
    if (!d.found) { el.classList.add('bad'); el.innerHTML = '<div class="st">❌ 查无此券码</div><div class="who">请核对顾客手机上的码</div>'; current = null; return; }
    if (d.redeemed) { el.classList.add('used');
      el.innerHTML = '<div class="pz">🎁 ' + esc(d.prizeCn) + '</div><div class="who">' + esc(d.name) + ' · ' + esc(d.phone) + '</div>' +
        '<div class="st">⚠️ 此券已核销' + (d.redeemedAt ? ' · ' + esc(d.redeemedAt) : '') + '</div><div class="who">不要重复发奖</div>' +
        '<button class="btn ghost" id="unredeemBtn" style="margin-top:12px">↩︎ 撤销核销(误操作)</button>';
      current = d.code; var ub = $('unredeemBtn'); if (ub) ub.onclick = doUnredeem; return; }
    el.classList.add('valid');
    el.innerHTML = '<div class="pz">🎁 ' + esc(d.prizeCn) + '</div><div class="who">' + esc(d.name) + ' · ' + esc(d.phone) +
      ' · <span class="code2">' + esc(d.code) + '</span></div>' +
      '<div class="st">✅ 有效 · 可发奖</div>' +
      '<button class="btn amber" id="confirmBtn" style="margin-top:12px">确认核销并发奖</button>';
    current = d.code;
    $('confirmBtn').onclick = doRedeem;
  }
  async function lookup() {
    var code = $('code').value.trim().toUpperCase();
    if (!code) return;
    $('redeemErr').textContent = ''; $('lookupBtn').disabled = true; $('res').className = 'res';
    try { renderRes(await api({ action: 'lookup', code: code })); }
    catch (e) { if (e && e.code === 'permission-denied') { lock(); } else $('redeemErr').textContent = '出错:' + (e.message || e); }
    finally { $('lookupBtn').disabled = false; }
  }
  async function doRedeem() {
    if (!current) return;
    var b = $('confirmBtn'); b.disabled = true; b.textContent = '核销中…';
    try {
      var d = await api({ action: 'redeem', code: current });
      var el = $('res'); el.className = 'res show ' + (d.already ? 'used' : 'valid');
      el.innerHTML = '<div class="pz">' + (d.already ? '⚠️ 已核销过' : '🎉 核销成功') + '</div>' +
        '<div class="who">🎁 ' + esc(d.prizeCn) + ' · ' + esc(d.name) + '</div>' +
        '<div class="st">' + (d.already ? '请勿重复发奖' : '已发奖,可进行下一单') + '</div>';
      current = null; $('code').value = ''; $('code').focus();
    } catch (e) { b.disabled = false; b.textContent = '确认核销并发奖'; $('redeemErr').textContent = '核销失败:' + (e.message || e); }
  }
  async function doUnredeem() {
    if (!current) return;
    if (!window.confirm('确定撤销这张券的核销状态吗?撤销后顾客可再次领取。')) return;
    var b = $('unredeemBtn'); if (b) { b.disabled = true; b.textContent = '撤销中…'; }
    try {
      var d = await api({ action: 'unredeem', code: current });
      var el = $('res'); el.className = 'res show valid';
      el.innerHTML = '<div class="pz">↩︎ 已撤销核销</div>' +
        '<div class="who">🎁 ' + esc(d.prizeCn) + ' · ' + esc(d.name) + '</div>' +
        '<div class="st">此券已恢复为「待领取」,可重新核销</div>';
      current = null; $('code').value = ''; $('code').focus();
    } catch (e) { if (b) { b.disabled = false; b.textContent = '↩︎ 撤销核销(误操作)'; } $('redeemErr').textContent = '撤销失败:' + (e.message || e); }
  }
  $('lookupBtn').onclick = lookup;
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') lookup(); });

  // ---- list ----
  async function loadList() {
    $('listStat').textContent = '载入中…'; $('listBox').innerHTML = '';
    try {
      var d = await api({ action: 'list' });
      $('listStat').textContent = '实物奖 ' + d.total + ' 份 · 已核销 ' + d.redeemedCount + ' · 待领 ' + (d.total - d.redeemedCount);
      if (!d.items.length) { $('listBox').innerHTML = '<div class="muted">暂无实物好礼记录</div>'; return; }
      $('listBox').innerHTML = d.items.map(function (x) {
        return '<div class="row"><span class="c">' + esc(x.code) + '</span>' +
          '<span class="p">' + esc(x.prizeCn) + ' · ' + esc(x.name) + '</span>' +
          '<span class="s ' + (x.redeemed ? 'y">已领' : 'n">待领') + '</span></div>';
      }).join('');
    } catch (e) { if (e && e.code === 'permission-denied') { lock(); } else $('listStat').textContent = '出错:' + (e.message || e); }
  }
  $('refreshBtn').onclick = loadList;

  // auto-enter if pass remembered this session
  if (PASS) { api({ action: 'ping' }).then(showConsole).catch(function () { lock(); }); }
});
</script>
</body>
</html>

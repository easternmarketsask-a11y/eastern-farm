<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>农场急救 · Eastern Farm</title>
<!--
  🔒 急救页（2026-08-12）——农场打不开时的唯一出路，也是唯一的现场诊断入口。

  设计约束（改动前务必守住，破一条这页就在真正需要它的时候用不了）：
  1. 单文件、零外部依赖：不引 CSS / 字体 / 图片 / 任何 js。
     最烂的网络也能打开——而这页存在的意义正是「别的都打不开的时候」。
  2. service-worker.js 里 /fix.html 走**缓存优先**（和别的静态资源一样）。
     ⚠️ 别按早期注释以为它「不拦截、永远走网络」——2026-08-12 实测那样写会让
     急救页自己在卡流下空白卡死（commit 5a06b58）。对救命路径而言「打得开」
     压倒「是最新的」；它随每次部署整包预缓存更新。
  3. 🔒 绝不碰 localStorage —— 玩家存档在 eastern_farm_save_v1 里。
     只注销 SW + 删 Cache Storage（那两样删了会自动重下）。
     唯一例外是下面的写入探针，它只写自己的 __ef_probe 键并立刻删掉。
  4. 诊断信息要**给人看**，不是给控制台看：Chris 用手机，打不开开发者工具。

  🔍 2026-08-13 扩充：加「存储真实占用」+「存档能不能写」探针。
     起因：Chris 手机上弹出「这台设备存不下本地缓存」那句提示，说明他设备上
     localStorage 在**抛异常**（state.js 的 _warnStorageOnce 只有抛错才触发）。
     本机实测整站只占 2.9 MB / 配额 10 GB，撑爆配额这条讲不通 → 必须拿到他设备
     上真实的**异常名**（QuotaExceededError=真满了 / SecurityError=Cookie 被拦
     或无痕模式）才能对症。这两条是完全不同的病，猜错就白修一轮。
-->
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 20px 16px calc(28px + env(safe-area-inset-bottom));
    font: 16px/1.65 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #fdf8ee; color: #4a3629;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 21px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: #8a7560; font-size: 14px; margin: 0 0 20px; }
  .card { background: #fff; border: 1px solid #ecdfc8; border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px solid #f4ece0; }
  .row:last-child { border-bottom: 0; }
  .k { color: #8a7560; flex: none; }
  .v { text-align: right; word-break: break-all; font-variant-numeric: tabular-nums; }
  .ok { color: #2f7a45; } .bad { color: #b3261e; }
  button {
    display: block; width: 100%; padding: 15px; margin-bottom: 10px; border-radius: 12px;
    font-size: 17px; font-weight: 600; font-family: inherit; cursor: pointer; border: 0;
  }
  .primary { background: #3a8c50; color: #fff; }
  .ghost { background: #fff; color: #8a5a12; border: 1px solid #c98a2e; font-weight: 500; }
  .note { font-size: 13px; color: #8a7560; margin: 14px 2px 0; }
  #done { display: none; background: #eaf6ed; border: 1px solid #b7ddc3; color: #2f7a45;
          border-radius: 12px; padding: 13px; margin-bottom: 12px; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🚑 农场急救</h1>
  <p class="sub">农场打不开时用这一页。存档不会丢。</p>

  <div id="done">✅ 已清理完毕，正在重新打开农场…</div>

  <button class="primary" id="btnFix">清理并重新打开农场</button>
  <button class="ghost" id="btnGo">直接打开农场</button>

  <div class="card" id="diag">
    <div class="row"><span class="k">正在读取状态…</span><span class="v"></span></div>
  </div>

  <!-- 只在 localStorage 真的快满时才出现（见脚本末尾）。平时不该让人看见一个
       听起来很吓人的按钮。 -->
  <button class="ghost" id="btnFree" style="display:none;">🧹 腾出存储空间（存档不动）</button>
  <button class="ghost" id="btnCopy">复制这张表</button>

  <p class="note">
    「清理」只会删掉本机存的<b>网页文件副本</b>（会自动重新下载），
    <b>不会动你的农场存档</b>——存档存在另一个地方，清理碰不到它。<br><br>
    如果清理后还是打不开，把上面这张表念给 Claude，那是设备的真实状态。
  </p>
</div>

<script>
(function () {
  var SAVE_KEY = 'eastern_farm_save_v1';
  var rows = [];
  function add(k, v, cls) { rows.push({ k: k, v: v, cls: cls || '' }); }
  function paint() {
    var h = '';
    for (var i = 0; i < rows.length; i++) {
      h += '<div class="row"><span class="k">' + rows[i].k + '</span>'
         + '<span class="v ' + rows[i].cls + '">' + rows[i].v + '</span></div>';
    }
    document.getElementById('diag').innerHTML = h;
  }

  function mb(n) {
    if (typeof n !== 'number' || !isFinite(n)) return '?';
    return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  }

  // 1) 存档在不在（最要紧的一条，先让人安心）
  var saveInfo = '读不到';
  var saveCls = 'bad';
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    // ⚠️ 空串要单独报：state.js 里 `if (saved)` 判定空串为「没存档」，
    // 而随后的二次确认 `'' !== null` 又成立 → 本会话永久禁止落盘 + 弹提示。
    // 这是「存储明明好好的却说存不下」的一条真实路径，不单列就永远查不出来。
    if (raw === '') { saveInfo = '⚠️ 空的(不是没有)'; saveCls = 'bad'; }
    else if (raw) { saveInfo = '在 · ' + Math.round(raw.length / 1024) + ' KB'; saveCls = 'ok'; }
    else { saveInfo = '这台设备上没有'; saveCls = ''; }
  } catch (e) { saveInfo = '读不到(' + e.name + ')'; }
  add('农场存档', saveInfo, saveCls);

  /* 2) 🔑 决定性的一条：存档到底能不能写。
        游戏里那句「这台设备存不下本地缓存」只有在 localStorage 抛异常时才弹，
        而异常名直接指向病因，是完全不同的两种病：
          QuotaExceededError → 真的满了 → 该给缓存减负
          SecurityError      → Cookie 被拦 / 无痕模式 / 内置浏览器隔离 → 减负没用
        只写自己的 __ef_probe 键（约 1KB，够触发配额边界），读回后立刻删。
        🔒 绝不碰 SAVE_KEY。 */
  var writeInfo = '—', writeCls = '';
  try {
    var probe = new Array(512).join('ab');   // ~1KB
    localStorage.setItem('__ef_probe', probe);
    var back = localStorage.getItem('__ef_probe');
    localStorage.removeItem('__ef_probe');
    if (back === probe) { writeInfo = '✅ 能写'; writeCls = 'ok'; }
    else { writeInfo = '⚠️ 写了读不回来'; writeCls = 'bad'; }
  } catch (e) {
    writeInfo = '❌ 不能(' + (e && e.name ? e.name : '未知') + ')';
    writeCls = 'bad';
  }
  add('存档能写吗', writeInfo, writeCls);

  add('存储占用', '查询中…');
  add('其中网页缓存', '…');

  /* 3) 本地一共存了多少 —— 🔑 必须**逐键列出**，只报总数等于没报。
        Chris 2026-08-13 手机实测：总量 5.0MB / 7 项、存档才 4KB，
        光看总数根本不知道是谁吃掉的（答案是积分同步队列）。
        WebKit 的 localStorage 是**独立的 5MB 桶**，跟上面那个 origin 配额
        （他机器上 39GB、显示 0%）完全无关 —— 所以只看 storage.estimate()
        会得出「一点都没满」的错误结论。这一段才是真正该看的地方。
        UTF-16 计量（×2），与 WebKit 算配额的口径一致。 */
  try {
    var tot = 0, items = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var n = (k.length + (localStorage.getItem(k) || '').length) * 2;
      tot += n;
      items.push([k, n]);
    }
    items.sort(function (a, b) { return b[1] - a[1]; });
    var FULL = 5 * 1024 * 1024;   // WebKit 的硬上限
    var pct = Math.round(tot * 1000 / FULL) / 10;
    add('本地存的数据', mb(tot) + ' / 5 MB (' + pct + '%) · ' + items.length + ' 项',
        pct >= 80 ? 'bad' : 'ok');
    // 快满了才把「腾空间」按钮露出来
    if (pct >= 70) {
      var fb = document.getElementById('btnFree');
      if (fb) fb.style.display = 'block';
    }
    for (var j = 0; j < items.length; j++) {
      // 名字太长会把手机版面撑爆，中间省略
      var nm = items[j][0];
      if (nm.length > 26) nm = nm.slice(0, 14) + '…' + nm.slice(-10);
      add('　└ ' + nm, mb(items[j][1]), items[j][1] > FULL / 4 ? 'bad' : '');
    }
  } catch (e) { add('本地存的数据', '读不到(' + e.name + ')', 'bad'); }

  // 4) 已装在本机的版本（Cache Storage 名字里带版本号）
  add('本机已装版本', '查询中…');
  add('已缓存文件数', '…');
  add('离线接管(SW)', '…');
  add('线上最新版本', '…');
  add('打开方式', (function () {
    var u = navigator.userAgent;
    var standalone = (window.navigator.standalone === true)
      || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    if (/MicroMessenger/i.test(u)) return '微信内置浏览器';
    if (/FBAN|FBAV|Instagram/i.test(u)) return 'App 内置浏览器';
    return standalone ? '主屏图标(PWA)' : '普通浏览器标签';
  })());
  add('Cookie', navigator.cookieEnabled ? '允许' : '❌ 被拦', navigator.cookieEnabled ? '' : 'bad');
  add('浏览器', (function () {
    var u = navigator.userAgent;
    var m = /(CriOS|Chrome)\/([\d.]+)/.exec(u);
    if (m) return (m[1] === 'CriOS' ? 'Chrome(iOS) ' : 'Chrome ') + m[2].split('.')[0];
    if (/Safari/.test(u)) return 'Safari';
    return u.slice(0, 28);
  })());
  paint();

  function setRow(k, v, cls) {
    for (var i = 0; i < rows.length; i++) if (rows[i].k === k) { rows[i].v = v; rows[i].cls = cls || ''; }
    paint();
  }

  /* 5) 整站占了多少 / 配额多大。iOS 的配额跟磁盘剩余空间挂钩，开发机上量不出来，
        必须在真机上读。usage 逼近 quota 才是「真的满了」，否则别再往配额上想。 */
  try {
    if (navigator.storage && navigator.storage.estimate) {
      navigator.storage.estimate().then(function (e) {
        var pct = e.quota ? Math.round((e.usage / e.quota) * 1000) / 10 : null;
        setRow('存储占用', mb(e.usage) + ' / ' + mb(e.quota) + (pct !== null ? ' (' + pct + '%)' : ''),
               pct !== null && pct > 80 ? 'bad' : 'ok');
      }).catch(function (er) { setRow('存储占用', '查不到(' + er.name + ')', 'bad'); });
    } else { setRow('存储占用', '浏览器不支持查询'); }
  } catch (e) { setRow('存储占用', '查不到', 'bad'); }

  try {
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        setRow('本机已装版本', ks.length ? ks.join(', ').replace(/eastern-farm-/g, '') : '(无)');
        if (!ks.length) { setRow('已缓存文件数', '0'); setRow('其中网页缓存', '0'); return; }
        // 逐条量真实字节：estimate() 的 usageDetails 只有 Chrome 有，iOS 读不到
        var files = 0, bytes = 0;
        var chain = Promise.resolve();
        ks.forEach(function (k) {
          chain = chain.then(function () {
            return caches.open(k).then(function (c) { return c.keys(); }).then(function (reqs) {
              files += reqs.length;
              setRow('已缓存文件数', String(files));
              var inner = Promise.resolve();
              reqs.forEach(function (r) {
                inner = inner.then(function () {
                  return caches.open(k).then(function (c) { return c.match(r); })
                    .then(function (res) { return res ? res.blob() : null; })
                    .then(function (b) { if (b) bytes += b.size; })
                    .catch(function () {});
                });
              });
              return inner;
            });
          });
        });
        return chain.then(function () { setRow('其中网页缓存', mb(bytes)); });
      }).catch(function (e) { setRow('本机已装版本', '查不到(' + e.name + ')', 'bad'); });
    } else { setRow('本机已装版本', '浏览器不支持缓存', ''); setRow('已缓存文件数', '—'); setRow('其中网页缓存', '—'); }
  } catch (e) { setRow('本机已装版本', '查不到', 'bad'); }

  try {
    if (navigator.serviceWorker) {
      navigator.serviceWorker.getRegistrations().then(function (rs) {
        setRow('离线接管(SW)', rs.length ? ('已注册 ' + rs.length + ' 个') : '未注册');
      }).catch(function () { setRow('离线接管(SW)', '查不到', 'bad'); });
    } else { setRow('离线接管(SW)', '浏览器不支持'); }
  } catch (e) { setRow('离线接管(SW)', '查不到', 'bad'); }

  // 3) 线上最新版本（no-store 强制走网络，这条也顺带验证网络通不通）
  fetch('/service-worker.js?v=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (src) {
      var m = src.match(/CACHE_VERSION\s*=\s*'([^']+)'/);
      setRow('线上最新版本', m ? m[1].replace('ef-', '') : '(读不到)', m ? 'ok' : 'bad');
    })
    .catch(function () { setRow('线上最新版本', '连不上服务器', 'bad'); });

  // ── 清理：注销 SW + 删 Cache Storage。🔒 绝不碰 localStorage（存档在那里）
  document.getElementById('btnFix').onclick = function () {
    var btn = this;
    btn.disabled = true;
    btn.textContent = '清理中…';
    var jobs = [];
    try {
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
        jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) {
          return Promise.all(rs.map(function (r) { return r.unregister().catch(function () {}); }));
        }).catch(function () {}));
      }
    } catch (e) {}
    try {
      if (window.caches && caches.keys) {
        jobs.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k).catch(function () {}); }));
        }).catch(function () {}));
      }
    } catch (e) {}
    // 卡死也要走：3.5 秒兜底，绝不让人停在「清理中…」
    var go = function () {
      document.getElementById('done').style.display = 'block';
      setTimeout(function () { location.replace('/src/index.html?fresh=' + Date.now()); }, 700);
    };
    var fired = false;
    var once = function () { if (!fired) { fired = true; go(); } };
    Promise.all(jobs).then(once).catch(once);
    setTimeout(once, 3500);
  };

  document.getElementById('btnGo').onclick = function () {
    location.href = '/src/index.html?fresh=' + Date.now();
  };

  /* 🧹 腾空间 —— 存储满时的现场急救（2026-08-13 加）。
     游戏代码里已经有自愈（开机裁队列 + 存档写失败重试），但那要**游戏能启动**
     才跑得到。这页存在的意义正是「游戏启动不了」，所以这里必须有一份不依赖
     游戏的。只删可再生的数据：
       - eastern_farm_sync_queue_v1 积分同步队列（实测就是它撑满 5MB 桶的；
         服务端按 eventId 去重，重发安全）
       - 天气缓存 / 世界杯遗留快照
     🔒 绝不碰 eastern_farm_save_v1（存档）和 ef_session_token（多标签页凭据，
        删了会让别的标签页误判接管，反而毁存档）。 */
  var FREEABLE = ['eastern_farm_sync_queue_v1', 'eastern_farm_weather_v2',
                  'ef_wc_live_snap_v1', 'wc2026_prefs_v1'];
  document.getElementById('btnFree').onclick = function () {
    var btn = this, freed = 0;
    for (var i = 0; i < FREEABLE.length; i++) {
      try {
        var raw = localStorage.getItem(FREEABLE[i]);
        if (raw !== null) {
          freed += (FREEABLE[i].length + raw.length) * 2;
          localStorage.removeItem(FREEABLE[i]);
        }
      } catch (e) {}
    }
    // 立刻验证一次「现在能写了吗」——这才是他真正关心的事
    var writable = false;
    try {
      localStorage.setItem('__ef_probe', 'x');
      localStorage.removeItem('__ef_probe');
      writable = true;
    } catch (e) {}
    btn.textContent = freed
      ? ('✅ 腾出 ' + mb(freed) + (writable ? '，存档现在能写了' : '，但还是写不进去'))
      : '没有可清的（存储不是被我们占的）';
    btn.disabled = true;
    // 重新量一遍，让表上的数字当场变
    setTimeout(function () { location.reload(); }, 1800);
  };

  /* 复制这张表 —— 诊断只有传回来才有用。手机上截图会漏行、念给我会漏字，
     一键复制粘进对话是最短的路。降级到 execCommand 是给不支持 clipboard API
     的 iOS 老版本用的（这页的用户恰恰就是环境不正常的那批）。 */
  document.getElementById('btnCopy').onclick = function () {
    var btn = this;
    var txt = '农场诊断 ' + new Date().toLocaleString('zh-CN') + '\n'
            + location.host + '\n';
    for (var i = 0; i < rows.length; i++) {
      txt += rows[i].k + ': ' + String(rows[i].v).replace(/<[^>]*>/g, '') + '\n';
    }
    txt += 'UA: ' + navigator.userAgent + '\n';
    var ok = function () { btn.textContent = '✅ 已复制，粘贴给 Chris/Claude'; };
    // ⚠️ clipboard API 被拒**必须**继续降级，不能就此放弃：iOS 上它会因为
    // 权限/非用户手势/内置浏览器等一堆理由 reject，而这页的用户恰恰环境不正常。
    var legacy = function () {
      try {
        var ta = document.createElement('textarea');
        ta.value = txt;
        ta.setAttribute('readonly', '');
        ta.style.cssText = 'position:absolute;left:-9999px;';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, txt.length);
        var done = document.execCommand('copy');
        document.body.removeChild(ta);
        done ? ok() : show();
      } catch (e) { show(); }
    };
    // 两条路都不通 → 把内容摊在页面上让人长按复制/截图，绝不留一句「复制不了」了事
    var show = function () {
      btn.textContent = '长按下面的文字复制';
      var pre = document.getElementById('diagText');
      if (!pre) {
        pre = document.createElement('textarea');
        pre.id = 'diagText';
        pre.style.cssText = 'width:100%;height:180px;margin-bottom:12px;font:12px/1.5 monospace;'
          + 'border:1px solid #ecdfc8;border-radius:10px;padding:10px;background:#fff;color:#4a3629;'
          + '-webkit-user-select:text;user-select:text;';
        btn.parentNode.insertBefore(pre, btn.nextSibling);
      }
      pre.value = txt;
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt).then(ok).catch(legacy);
        return;
      }
    } catch (e) {}
    legacy();
  };
})();
</script>
</body>
</html>

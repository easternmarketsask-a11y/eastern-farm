<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf8ee">

<!-- ==================== PWA (add to home screen) ==================== -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="快乐农场">

<title>东方超市·快乐农场 · Happy Farm</title>

<!-- ==================== Social share metadata ====================
     Used by WeChat (when shared in a chat / Moments), iMessage,
     Facebook, X/Twitter, LinkedIn, etc. WeChat specifically reads
     <title> + <meta name="description"> + og:image (square ~500×500
     is preferred). Image MUST be an absolute URL (relative ones
     don't resolve in the WeChat preview crawler). -->
<meta name="description" content="🎁 东方超市·快乐农场 | 登录有奖！玩农场游戏、赚超市积分。免费玩，无下载，天天收获！">
<link rel="icon" type="image/png" href="https://farm.easternmarket.ca/src/assets/images/share-card.png">

<meta property="og:type" content="website">
<meta property="og:title" content="🎁 东方超市·快乐农场 | 登录有奖！">
<meta property="og:description" content="玩农场游戏、赚超市积分。免费玩，无下载，天天收获！">
<meta property="og:image" content="https://farm.easternmarket.ca/src/assets/images/share-card.png">
<meta property="og:image:width" content="500">
<meta property="og:image:height" content="500">
<meta property="og:image:alt" content="东方超市·快乐农场">
<meta property="og:url" content="https://farm.easternmarket.ca">
<meta property="og:site_name" content="Eastern Market 东方超市">
<meta property="og:locale" content="zh_CN">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="🎁 东方超市·快乐农场 | 登录有奖！">
<meta name="twitter:description" content="玩农场游戏、赚超市积分。免费玩，无下载，天天收获！">
<meta name="twitter:image" content="https://farm.easternmarket.ca/src/assets/images/share-card.png">

<!-- Kawaii display fonts (rounded, playful). The CSS already references
     'ZCOOL KuaiLe' (--font-display) but the link was missing, so it silently
     fell back to system fonts. Load it + Fredoka (rounded Latin) so headings/
     buttons get the cute look. display=swap → graceful fallback if offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=ZCOOL+KuaiLe&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Splash overlay (shown on first load; tap to enter) -->
<div id="splash" class="splash">
  <!-- Decorative meadow strip pinned to the bottom: hills + a row of
       freshly-planted veggies. Sits behind the content (z-index). -->
  <!-- Real illustration strip pinned to the bottom (same farm-backdrop.jpg
       as the in-game scene band). Top edge fades into the cream splash via
       CSS mask. Content sits high enough to clear the PWA install banner. -->
  <div class="splash-scene" aria-hidden="true">
    <img class="splash-scene-img" src="assets/images/farm-backdrop.jpg" alt="">
  </div>
  <div class="splash-content">
    <img class="splash-logo" src="assets/images/logo-horizontal.png" alt="东方超市 · Eastern Market">
    <div class="splash-title-zh">快乐农场</div>
    <div class="splash-title-en">Happy Farm</div>
    <div class="splash-tagline">
      <span class="splash-tagline-zh">好菜自己种</span>
      <span class="splash-tagline-en">Grow your own</span>
    </div>
    <!-- Reward hook + perks: pull guests over the login line. Hidden once
         signed in (see firebase-auth._renderSplash). -->
    <div class="splash-reward" id="splashReward">
      <span class="splash-reward-gift">🎁</span>
      <span class="splash-reward-main">登录立得 <b>3000 农场币</b> 开局礼包</span>
      <span class="splash-reward-en">Sign in → 3000 coins to start</span>
    </div>
    <ul class="splash-perks" id="splashPerks">
      <li>🥬 攒超市积分，换东方超市真优惠</li>
      <li>🏘 跟邻居互动、偷菜、互帮</li>
      <li>☁️ 进度云端保存，换手机也不丢</li>
    </ul>
    <!-- PRIMARY: login (rewarded). SECONDARY: guest trial as a small link. -->
    <button class="splash-login splash-login--hero" id="splashLogin">
      <span class="icon">📱</span>
      <span>手机号登录 · 领礼包</span>
    </button>
    <button class="splash-start splash-start--ghost" id="splashStart">
      <span class="splash-start-zh">先随便逛逛</span>
      <span class="splash-start-en">Just look around ›</span>
    </button>
    <div class="splash-footer">
      <span>🏪 Saskatoon · 133-412 Willowgrove Square</span>
    </div>
  </div>
</div>

<div id="app">

  <!-- Combined header: brand logo + weather + currencies + member + today,
       all in ONE compact bar (was two stacked bands). id="brandbar" kept so
       weather.js still appends its chip next to the logo. -->
  <header id="topbar">
    <div id="brandbar" class="brand-cluster">
      <a class="brandbar-logo-link" href="https://easternmarket.ca/" title="访问东方超市官网 · Visit Eastern Market">
        <img class="brandbar-logo" src="assets/images/logo-horizontal.png" alt="东方超市 Eastern Market">
      </a>
      <span class="brand-sprout">🌱</span>
      <!-- weatherChip injected here by weather.js -->
    </div>
    <div class="topbar-right">
      <div id="memberButton" class="topbar-member-slot"></div>
      <button id="todayButton" class="today-button" title="今日签到 · 活动">
        <span class="today-icon">🌅</span>
        <span class="today-label">今日</span>
        <span id="todayBadge" class="today-badge"></span>
      </button>
      <button id="guideButton" class="guide-button guide-button--icon" title="怎么玩 · How to play" aria-label="怎么玩 · How to play" onclick="Farm.guide && Farm.guide.open()">
        <span class="guide-icon">ⓘ</span>
      </button>
    </div>
  </header>

  <!-- Festival banner (shows during events) -->
  <div id="festivalBanner" class="festival-banner hidden">
    <span class="festival-icon">🎊</span>
    <span class="festival-text" id="festivalText"></span>
  </div>


  <!-- Currency + harvest status band: 农场币 on the left, "when are my crops
       ready" status in the middle, 超市积分 on the right. -->
  <div id="harvestStatusBar" class="harvest-status-bar">
    <button class="currency coins currency-tappable" id="coinsCard" title="农场币 — 点开看获取规则与兑换">
      <div class="currency-row">
        <span class="icon coin-icon"></span>
        <span class="value" id="coinsValue">100</span>
        <span class="currency-chevron">›</span>
      </div>
      <div class="label">农场币 · Coin</div>
    </button>
    <div class="harvest-status-center" id="harvestStatusCenter">
      <span class="harvest-status-text" id="harvestStatusText"></span>
      <button class="btn harvest-status-btn hidden" id="harvestStatusBtn"></button>
    </div>
    <button class="currency points currency-tappable" id="pointsCard" title="超市积分 — 点开兑换与积分明细">
      <div class="currency-row">
        <span class="icon points-icon"></span>
        <span class="value" id="pointsValue">0</span>
        <span class="currency-chevron">›</span>
      </div>
      <div class="label">超市积分 · Points</div>
    </button>
  </div>

  <!-- Main farm view -->
  <main id="farm">
    <!-- Decorative backdrop band: REAL illustration (cropped from the
         Gemini-generated reference, 1408x300 jpg). object-fit:cover crops
         responsively — phones see the farmhouse + sun, wider screens see
         more scene. The cartoon fence below is inline SVG in the same
         style (amber pickets + dark outline), left/right segments with an
         open center like the reference. -->
    <div class="farm-scene" aria-hidden="true">
      <img class="farm-scene-img" src="assets/images/farm-backdrop.jpg" alt="">
      <svg class="farm-scene-fence" viewBox="0 0 390 46" preserveAspectRatio="xMidYMid slice">
        <g stroke="#5d3a1a" stroke-width="1.6" fill="#c98b42">
          <!-- left segment -->
          <rect x="-4" y="16" width="124" height="7" rx="3.5"/>
          <rect x="-4" y="30" width="124" height="7" rx="3.5"/>
          <rect x="6"  y="6" width="11" height="36" rx="5"/>
          <rect x="36" y="4" width="11" height="38" rx="5"/>
          <rect x="66" y="6" width="11" height="36" rx="5"/>
          <rect x="96" y="4" width="11" height="38" rx="5"/>
          <!-- right segment -->
          <rect x="270" y="16" width="124" height="7" rx="3.5"/>
          <rect x="270" y="30" width="124" height="7" rx="3.5"/>
          <rect x="283" y="6" width="11" height="36" rx="5"/>
          <rect x="313" y="4" width="11" height="38" rx="5"/>
          <rect x="343" y="6" width="11" height="36" rx="5"/>
          <rect x="373" y="4" width="11" height="38" rx="5"/>
        </g>
        <!-- picket highlights -->
        <g fill="#e3a85e" opacity="0.7">
          <rect x="8"  y="8" width="3" height="30" rx="1.5"/>
          <rect x="38" y="6" width="3" height="32" rx="1.5"/>
          <rect x="68" y="8" width="3" height="30" rx="1.5"/>
          <rect x="98" y="6" width="3" height="32" rx="1.5"/>
          <rect x="285" y="8" width="3" height="30" rx="1.5"/>
          <rect x="315" y="6" width="3" height="32" rx="1.5"/>
          <rect x="345" y="8" width="3" height="30" rx="1.5"/>
          <rect x="375" y="6" width="3" height="32" rx="1.5"/>
        </g>
      </svg>
    </div>
    <div class="farm-grid" id="farmGrid">
      <!-- Plots injected here by farm.js -->
    </div>
    <div id="farmDecorations" class="farm-decorations">
      <!-- Decorations injected here by farm.js renderDecorations() -->
    </div>
  </main>

  <!-- Storekeeper NPC: custom Eastern Market grocer (green apron, holding
       a bok choy) — same soft rounded style as the crop art. -->
  <div id="storekeeper" class="storekeeper">
    <div class="storekeeper-avatar" aria-hidden="true">
      <!-- Friendly Eastern Market grocer — clean circular avatar badge (green cap +
           apron, warm smile). Redesigned 2026-06-18 for a professional, approachable look. -->
      <svg viewBox="0 0 100 100">
        <defs><clipPath id="skClip"><circle cx="50" cy="50" r="50"/></clipPath></defs>
        <g clip-path="url(#skClip)">
          <circle cx="50" cy="50" r="50" fill="#eaf6df"/>
          <!-- shoulders + shirt -->
          <path d="M14 101 Q 16 80 36 73 L 64 73 Q 84 80 86 101 Z" fill="#fbf6ec"/>
          <!-- apron (brand green) + straps -->
          <path d="M36 101 L 36 79 Q 50 73 64 79 L 64 101 Z" fill="#3a8c50"/>
          <path d="M44 79 L 49 73 M56 79 L 51 73" stroke="#2f7343" stroke-width="2" stroke-linecap="round"/>
          <rect x="43" y="86" width="14" height="10" rx="2.5" fill="#2f7343"/>
          <!-- neck -->
          <path d="M44 62 L 56 62 L 56 72 Q 50 76 44 72 Z" fill="#f0c098"/>
          <!-- ears -->
          <circle cx="29" cy="45" r="5" fill="#f6c79e"/>
          <circle cx="71" cy="45" r="5" fill="#f6c79e"/>
          <!-- face -->
          <circle cx="50" cy="44" r="22" fill="#f9d0a7"/>
          <!-- side hair -->
          <path d="M28 46 Q 27 30 34 26 L 36 40 Q 31 40 28 46 Z" fill="#5b4329"/>
          <path d="M72 46 Q 73 30 66 26 L 64 40 Q 69 40 72 46 Z" fill="#5b4329"/>
          <!-- cap dome + brim -->
          <path d="M29 33 Q 31 15 50 15 Q 69 15 71 33 Q 50 27 29 33 Z" fill="#3a8c50"/>
          <path d="M27 33 Q 50 40 73 33 L 73 30 Q 50 36 27 30 Z" fill="#2f7343"/>
          <circle cx="50" cy="16.5" r="2.3" fill="#2f7343"/>
          <!-- eyes (with highlight) + smile + blush -->
          <circle cx="42.5" cy="45" r="3.3" fill="#4a3526"/>
          <circle cx="57.5" cy="45" r="3.3" fill="#4a3526"/>
          <circle cx="43.7" cy="43.8" r="1.1" fill="#fff"/>
          <circle cx="58.7" cy="43.8" r="1.1" fill="#fff"/>
          <path d="M42 52 Q 50 59 58 52" stroke="#bd6e3e" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <ellipse cx="36" cy="51" rx="3.6" ry="2.4" fill="#ff9e84" opacity="0.5"/>
          <ellipse cx="64" cy="51" rx="3.6" ry="2.4" fill="#ff9e84" opacity="0.5"/>
        </g>
        <circle cx="50" cy="50" r="48.5" fill="none" stroke="#ffffff" stroke-width="3"/>
      </svg>
    </div>
    <div class="storekeeper-bubble" id="storekeeperBubble">
      点击棕色的地块种下第一粒种子。
    </div>
  </div>

  <!-- Player status strip (Lv + title + XP + next plot hint), above bottom nav -->
  <div id="statusbar" class="statusbar">
    <span class="status-level">Lv <span id="levelValue">1</span></span>
    <span class="status-title" id="titleLabel">新手</span>
    <div class="status-xp-bar"><div class="status-xp-fill" id="xpFill"></div></div>
    <span class="status-xp-text" id="xpText"></span>
    <span class="status-next-plot" id="nextPlotHint" title="下个地块解锁等级"></span>
  </div>

  <!-- Bottom action bar -->
  <nav id="bottombar">
    <button class="action-btn" data-action="shop">
      <span class="action-icon">🛒</span>
      <span class="action-label" data-i18n="nav_shop">种子店</span>
    </button>
    <button class="action-btn" data-action="tasks">
      <span class="action-icon">📋</span>
      <span class="action-label" data-i18n="nav_tasks">任务</span>
      <span class="task-badge" id="taskBadge"></span>
    </button>
    <button class="action-btn" data-action="community">
      <span class="action-icon">🏘</span>
      <span class="action-label" data-i18n="nav_community">社区</span>
    </button>
    <button class="action-btn" data-action="store">
      <span class="action-icon">🛍️</span>
      <span class="action-label" data-i18n="nav_store">农场商城</span>
    </button>
    <button class="action-btn" data-action="collection">
      <span class="action-icon">📖</span>
      <span class="action-label" data-i18n="nav_collection">图鉴</span>
    </button>
  </nav>

  <!-- Modal overlay (used by all dialogs) -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content" id="modalContent">
      <!-- Content injected per dialog -->
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast" class="toast hidden"></div>

</div>

<!-- Firebase SDKs (compat builds — keep global firebase.* namespace) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script>

<!-- Module loading: order matters -->
<script src="js/analytics.js"></script>
<script src="js/i18n.js"></script>
<script src="js/weather.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/crops.js"></script>
<script src="js/crop-art.js"></script>
<script src="js/ui.js"></script>
<script src="js/coach.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/firebase-queue.js"></script>
<script src="js/firebase-points.js"></script>
<script src="js/firebase-auth.js"></script>
<script src="js/firebase-game-sync.js"></script>
<script src="js/firebase-push.js"></script>
<script src="js/ep-shop.js"></script>
<script src="js/ai-neighbors.js"></script>
<script src="js/social-steal.js"></script>
<script src="js/neighbors.js"></script>
<script src="js/home-report.js"></script>
<script src="js/daily.js"></script>
<script src="js/login-calendar.js"></script>
<script src="js/farm.js"></script>
<script src="js/tending.js"></script>
<script src="js/seasons.js"></script>
<script src="js/harvest-status.js"></script>
<script src="js/warehouse.js"></script>
<script src="js/shop.js"></script>
<script src="js/tasks.js"></script>
<script src="js/events.js"></script>
<script src="js/storekeeper.js"></script>
<script src="js/rewards.js"></script>
<script src="js/achievements.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/guide.js"></script>
<script src="js/spotlight.js"></script>
<script src="js/login-nudge.js"></script>
<script src="js/promo.js"></script>
<script src="js/share.js"></script>
<script src="js/mapview.js"></script>
<script src="js/mapview-iso.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa-install.js"></script>

<!-- Register the PWA service worker at root scope so it can cache the /src/
     app shell and apply network-first to /data/. Failure is non-fatal. -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('/service-worker.js', { scope: '/' })
        .catch(function (e) { console.warn('[pwa] SW registration failed:', e); });
    });
  }
</script>

</body>
</html>

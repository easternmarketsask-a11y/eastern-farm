<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#fdf8ee">
<title>东方超市·快乐农场 · Happy Farm</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Splash overlay (shown on first load; tap to enter) -->
<div id="splash" class="splash">
  <div class="splash-content">
    <img class="splash-logo" src="assets/images/logo-horizontal.png" alt="东方超市 · Eastern Market">
    <div class="splash-title-zh">快乐农场</div>
    <div class="splash-title-en">Happy Farm</div>
    <div class="splash-tagline">
      <span class="splash-tagline-zh">好菜自己种</span>
      <span class="splash-tagline-en">Grow your own</span>
    </div>
    <button class="splash-start" id="splashStart">
      <span class="splash-start-icon">🌱</span>
      <span class="splash-start-zh">开始游戏</span>
      <span class="splash-start-en">Start</span>
    </button>
    <div class="splash-footer">
      <span>🏪 Saskatoon · 133-412 Willowgrove Square</span>
    </div>
  </div>
</div>

<div id="app">

  <!-- Brand bar (always visible) -->
  <div id="brandbar" class="brandbar">
    <a class="brandbar-logo-link" href="https://easternmarket.ca/" title="访问东方超市官网 · Visit Eastern Market">
      <img class="brandbar-logo" src="assets/images/logo-horizontal.png" alt="东方超市 Eastern Market">
    </a>
    <span class="brandbar-divider"></span>
    <span class="brandbar-title">
      <span class="brandbar-title-zh-row">
        <span class="brandbar-title-zh">快乐农场</span>
        <span class="brandbar-sprout">🌱</span>
      </span>
      <span class="brandbar-title-en">Happy Farm</span>
    </span>
  </div>

  <!-- Top status bar (4 slots, compact) -->
  <header id="topbar">
    <div id="memberButton" class="topbar-member-slot"></div>
    <div class="currency coins" title="农场币 Farm Coin">
      <div class="currency-row">
        <span class="icon coin-icon"></span>
        <span class="value" id="coinsValue">100</span>
      </div>
      <div class="label">农场币 · Coin</div>
    </div>
    <div class="currency points" title="东方积分 Eastern Points">
      <div class="currency-row">
        <span class="icon points-icon"></span>
        <span class="value" id="pointsValue">0</span>
      </div>
      <div class="label">东方积分 · Points</div>
    </div>
    <button id="todayButton" class="today-button" title="今日">
      <span class="today-icon">🌅</span>
      <span id="todayBadge" class="today-badge"></span>
    </button>
  </header>

  <!-- Festival banner (shows during events) -->
  <div id="festivalBanner" class="festival-banner hidden">
    <span class="festival-icon">🎊</span>
    <span class="festival-text" id="festivalText"></span>
  </div>


  <!-- Main farm view -->
  <main id="farm">
    <div class="farm-grid" id="farmGrid">
      <!-- Plots injected here by farm.js -->
    </div>
    <div id="farmDecorations" class="farm-decorations">
      <!-- Decorations injected here by farm.js renderDecorations() -->
    </div>
  </main>

  <!-- Storekeeper NPC -->
  <div id="storekeeper" class="storekeeper">
    <div class="storekeeper-avatar">👨‍🌾</div>
    <div class="storekeeper-bubble" id="storekeeperBubble">
      点击棕色的地块种下第一粒种子。
    </div>
  </div>

  <!-- Player status strip (Lv + title + XP + next plot hint), above bottom nav -->
  <div id="statusbar" class="statusbar">
    <span class="status-level">Lv <span id="levelValue">1</span></span>
    <span class="status-title" id="titleLabel">新手</span>
    <div class="status-xp-bar"><div class="status-xp-fill" id="xpFill"></div></div>
    <span class="status-xp-text" id="xpText"></span>
    <span class="status-next-plot" id="nextPlotHint" title="下个地块解锁等级"></span>
  </div>

  <!-- Bottom action bar -->
  <nav id="bottombar">
    <button class="action-btn" data-action="shop">
      <span class="action-icon">🛒</span>
      <span class="action-label" data-i18n="nav_shop">种子店</span>
    </button>
    <button class="action-btn" data-action="tasks">
      <span class="action-icon">📋</span>
      <span class="action-label" data-i18n="nav_tasks">任务</span>
      <span class="task-badge" id="taskBadge"></span>
    </button>
    <button class="action-btn" data-action="rewards">
      <span class="action-icon">🎁</span>
      <span class="action-label" data-i18n="nav_rewards">兑换</span>
    </button>
    <button class="action-btn" data-action="collection">
      <span class="action-icon">📖</span>
      <span class="action-label" data-i18n="nav_collection">图鉴</span>
    </button>
    <button class="action-btn" data-action="settings">
      <span class="action-icon">⚙️</span>
      <span class="action-label" data-i18n="nav_settings">设置</span>
    </button>
  </nav>

  <!-- Modal overlay (used by all dialogs) -->
  <div id="modal" class="modal hidden">
    <div class="modal-backdrop"></div>
    <div class="modal-content" id="modalContent">
      <!-- Content injected per dialog -->
    </div>
  </div>

  <!-- Toast notifications -->
  <div id="toast" class="toast hidden"></div>

</div>

<!-- Firebase SDKs (compat builds — keep global firebase.* namespace) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<!-- Module loading: order matters -->
<script src="js/i18n.js"></script>
<script src="js/state.js"></script>
<script src="js/audio.js"></script>
<script src="js/crops.js"></script>
<script src="js/crop-art.js"></script>
<script src="js/ui.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/firebase-queue.js"></script>
<script src="js/firebase-points.js"></script>
<script src="js/firebase-auth.js"></script>
<script src="js/firebase-game-sync.js"></script>
<script src="js/ep-shop.js"></script>
<script src="js/neighbors.js"></script>
<script src="js/daily.js"></script>
<script src="js/farm.js"></script>
<script src="js/warehouse.js"></script>
<script src="js/shop.js"></script>
<script src="js/tasks.js"></script>
<script src="js/events.js"></script>
<script src="js/storekeeper.js"></script>
<script src="js/rewards.js"></script>
<script src="js/achievements.js"></script>
<script src="js/main.js"></script>

</body>
</html>

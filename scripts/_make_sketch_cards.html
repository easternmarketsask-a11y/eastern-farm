<!doctype html>
<meta charset="utf-8">
<title>东方农场 · 简笔画海报</title>
<!-- 字体走 Google Fonts CDN。⚠️ 无网络会静默回退成系统字体，出图前肉眼确认
     标题是 ZCOOL XiaoWei 的书法骨架，不是黑体。渲染命令见 promo/README.md。
     _logo.png 是抠掉白底的东方超市 logo，由 _make_poster_onart.logo_keyed() 生成。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Plus+Jakarta+Sans:wght@500;700&display=swap">
<style>
/* 🔒 ZCOOL XiaoWei 的「回」是坏字形（字体自带豆腐块，不回退）。
   照抄 src/css/style.css 的补丁：U+56DE 交给系统字体，且必须排在栈首。
   第 2 张标题「积分回到会员卡」就有「回」。 */
@font-face{
  font-family:'EF XiaoWei Patch';
  src: local('Microsoft YaHei'), local('PingFang SC'), local('Noto Sans SC'),
       local('Noto Sans CJK SC'), local('Source Han Sans SC');
  unicode-range: U+56DE;
}
:root{
  --paper:#FBF7EC; --band:#F1E7D1; --ink:#26301F; --green:#3A8C50;
  --deep:#2A5C34; --spark:#E8522A;
  --display:'EF XiaoWei Patch','ZCOOL XiaoWei','Noto Sans SC','Microsoft YaHei',sans-serif;
  --en:'Plus Jakarta Sans','Segoe UI',sans-serif;
  --sans:'Noto Sans SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#888}
.card{position:relative;width:1080px;height:1350px;background:var(--paper);
  overflow:hidden;display:flex;flex-direction:column}
.frame{position:absolute;left:0;top:0;right:0;height:1146px;pointer-events:none;z-index:3}
/* 🔒 抬头：东方超市 logo + 产品名。Chris 2026-08-23「所有宣传图都要有
   东方超市 LOGO 以及东方农场」。EASTERN FARM 与中文并排同一行、不做下注脚
   （CLAUDE.md 画面口味：「Eastern Farm 要醒目并跟中文拉开，不许当下注脚」）。 */
.mast{flex:0 0 auto;margin:52px 0 0;display:flex;align-items:center;
  justify-content:center;gap:24px}
.mast img{height:66px;width:auto;display:block}
.mast .bar{width:2px;height:48px;background:var(--ink);opacity:.2}
.mast .names{display:flex;align-items:center;gap:18px}
.mast .nzh{font:400 45px/1 var(--display);color:var(--deep)}
.mast .nen{font:700 21px/1 var(--en);letter-spacing:.2em;color:var(--green)}
.rule{flex:0 0 auto;margin:22px 86px 0;height:2px;background:var(--ink);opacity:.16}
.art{flex:0 0 536px;margin-top:24px;display:flex;align-items:center;justify-content:center}
.art svg{width:770px;height:auto;display:block}
.words{flex:1 1 auto;padding:0 86px 30px;display:flex;flex-direction:column;justify-content:center}
h1{font:400 78px/1.26 var(--display);color:var(--deep);letter-spacing:.02em;text-wrap:balance}
h1 .hot{color:var(--spark)}
.en{margin-top:26px;font:700 35px/1.3 var(--en);color:var(--ink);opacity:.9}
.sub{margin-top:20px;font:400 29px/1.58 var(--sans);color:var(--ink);opacity:.74;max-width:23em}
.sub b{color:var(--spark);font-weight:500;opacity:1}
.band{flex:0 0 204px;background:var(--band);display:flex;align-items:center;
  gap:38px;padding:0 76px;position:relative}
.band::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 13px,transparent 13px 26px);opacity:.36}
.band img{width:142px;height:142px;display:block;border-radius:6px}
.bt1{font:400 39px/1.15 var(--display);color:var(--deep)}
.bt2{margin-top:10px;font:700 31px/1.15 var(--en);color:var(--green)}
.bt3{margin-top:10px;font:400 24px/1.2 var(--sans);color:var(--ink);opacity:.62}
svg .ink{fill:none;stroke:var(--ink);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
svg .thin{stroke-width:4.6}
svg .hair{stroke-width:5.6}
svg .wash{fill:var(--green);opacity:.2;stroke:none}
svg .hot{fill:var(--spark);opacity:.26;stroke:none}
svg .hotline{fill:none;stroke:var(--spark);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
svg .dot{fill:var(--ink);stroke:none}
svg .dash{stroke-dasharray:11 10}
body.grid{display:flex;flex-wrap:wrap;gap:26px;padding:26px;justify-content:center}
body.grid .card{zoom:.34;box-shadow:0 6px 26px rgba(0,0,0,.4)}
</style>

<!-- 重新生成时：字体走 Google Fonts CDN。⚠️ 无网络会静默回退成系统字体，
     出图前务必肉眼确认标题是 ZCOOL XiaoWei 的书法骨架，不是黑体。
     渲染命令见 promo/README.md「简笔画卡片」一节。 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Plus+Jakarta+Sans:wght@500;700&display=swap">
<style>
/* 🔒 ZCOOL XiaoWei 的「回」是坏字形（字体自带豆腐块，不回退）。
   照抄 src/css/style.css 的补丁：把 U+56DE 交给系统字体，且必须排在栈首。 */
@font-face{
  font-family:'EF XiaoWei Patch';
  src: local('Microsoft YaHei'), local('PingFang SC'), local('Noto Sans SC'),
       local('Noto Sans CJK SC'), local('Source Han Sans SC');
  unicode-range: U+56DE;
}
:root{
  --paper:#FBF7EC;      /* 暖纸 */
  --band:#F1E7D1;       /* 扫码通栏 */
  --ink:#26301F;        /* 线 —— 偏绿的近黑，不是纯黑 */
  --green:#3A8C50;      /* 品牌绿，唯一色块 */
  --deep:#2A5C34;       /* 标题 */
  --spark:#E8522A;      /* 品牌橙红，每张只点一处 */
  --display:'EF XiaoWei Patch','ZCOOL XiaoWei','Noto Sans SC','Microsoft YaHei',sans-serif;
  --en:'Plus Jakarta Sans','Segoe UI',sans-serif;
  --sans:'Noto Sans SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#888}
.card{
  position:relative; width:1080px; height:1350px; background:var(--paper);
  overflow:hidden; display:flex; flex-direction:column;
}
/* 手绘双线边框 */
.frame{position:absolute; left:0; top:0; right:0; height:1124px; pointer-events:none; z-index:3}
.eyebrow{
  position:absolute; top:74px; left:0; width:100%; text-align:center;
  font:500 27px/1 var(--sans); letter-spacing:.34em; color:var(--green);
}
.eyebrow b{font-weight:500}
.art{flex:0 0 578px; margin-top:100px; display:flex; align-items:center; justify-content:center}
.art svg{width:800px;height:auto;display:block}
.words{flex:1 1 auto; padding:0 86px 30px; display:flex; flex-direction:column; justify-content:center}
h1{
  font:400 82px/1.26 var(--display); color:var(--deep);
  letter-spacing:.02em; text-wrap:balance;
}
h1 .hot{color:var(--spark)}
.en{
  margin-top:26px; font:700 35px/1.3 var(--en); color:var(--ink);
  letter-spacing:.005em; opacity:.9;
}
.sub{
  margin-top:22px; font:400 30px/1.6 var(--sans); color:var(--ink); opacity:.74;
  max-width:23em;
}
/* 扫码通栏 */
.band{
  flex:0 0 226px; background:var(--band); display:flex; align-items:center;
  gap:38px; padding:0 76px; position:relative;
}
.band::before{
  content:""; position:absolute; top:0; left:0; right:0; height:4px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 13px,transparent 13px 26px);
  opacity:.36;
}
.band img{width:158px;height:158px;display:block;border-radius:6px}
.bt1{font:400 42px/1.15 var(--display); color:var(--deep)}
.bt2{margin-top:11px; font:700 33px/1.15 var(--en); color:var(--green); letter-spacing:.01em}
.bt3{margin-top:11px; font:400 25px/1.2 var(--sans); color:var(--ink); opacity:.62}
/* 简笔画线条 */
svg .ink{fill:none;stroke:var(--ink);stroke-width:7.5;stroke-linecap:round;stroke-linejoin:round}
svg .thin{stroke-width:4.6}
svg .fat{stroke-width:10}
svg .wash{fill:var(--green);opacity:.2;stroke:none}
svg .hot{fill:var(--spark);opacity:.26;stroke:none}
svg .hotline{fill:none;stroke:var(--spark);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
svg .paper{fill:var(--paper)}
/* 预览页（不进截图） */
body.grid{display:flex;flex-wrap:wrap;gap:26px;padding:26px;justify-content:center}
body.grid .card{zoom:.34;box-shadow:0 6px 26px rgba(0,0,0,.4)}
</style>
